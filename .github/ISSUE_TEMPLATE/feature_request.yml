name: 功能建议
description: 新函数、新坐标系、性能改进或 API 调整
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 要解决的实际问题（例如电子围栏、轨迹缓冲、道路匹配前处理）
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的 API / 行为
      description: 如果 turf 有对应函数，请注明名称；如果涉及精度，请说明期望的精度量级
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代做法
