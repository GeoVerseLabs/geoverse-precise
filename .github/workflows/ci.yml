name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # clippy 门禁使用的工具链（本地已验证 -D warnings 通过的版本）
  CLIPPY_TOOLCHAIN: 1.97.0

jobs:
  rust:
    name: Rust（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # clippy 门禁固定工具链版本：新版 clippy 增加的 lint 不会让 CI 突然变红，
      # 升级在下方 clippy-latest 任务中先以警告形式暴露，再手动调整 CLIPPY_TOOLCHAIN。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CLIPPY_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test（含 GeographicLib / PROJ 对照）
        run: cargo test -p geoverse-precise-core --release

  clippy-latest:
    name: clippy（最新 stable，仅提示，失败不阻塞）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy -D warnings（结果转为注释）
        run: |
          set +e
          cargo clippy --color never --workspace --all-targets --message-format=short -- -D warnings > clippy.txt 2>&1
          code=$?
          cat clippy.txt
          echo "::notice::$(rustc --version) / clippy exit code ${code}"
          grep -E '^[^ ]+\.rs:[0-9]+:[0-9]+: (warning|error)' clippy.txt \
            | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (warning|error)(\[[^]]*\])?: (.*)$/::warning file=\1,line=\2,col=\3::\4: \6/'
          # 非源码定位的错误（依赖、工具链等）也转成注释，最多 20 行
          grep -E '^(error|warning)' clippy.txt | grep -v -E '^warning: .* generated [0-9]+ warning' | head -20 \
            | sed -E 's/^(.*)$/::warning::\1/'
          exit "${code}"

  msrv:
    name: 最低 Rust 版本（MSRV）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 读取 Cargo.toml 中的 rust-version
        id: msrv
        run: echo "version=$(grep -m1 -E '^rust-version *= *"' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo check（锁定依赖）
        run: cargo check --workspace --all-targets --locked

  wasm:
    name: WASM + TypeScript 包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-wasm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/geoverse-precise/package-lock.json
            examples/web-demo/package-lock.json
      - name: 编译并测试 TS 封装
        working-directory: packages/geoverse-precise
        run: |
          npm ci
          npm run build
          npm test
      - name: 在最低与最新 Node 上复测（engines >= 20）
        working-directory: packages/geoverse-precise
        run: |
          for v in 20 24; do
            echo "::group::node $v"
            npx -y -p "node@$v" node --test test/*.test.mjs
            echo "::endgroup::"
          done
      - name: 打包 npm tarball 并检查包结构
        working-directory: packages/geoverse-precise
        run: |
          cp ../../LICENSE-MIT ../../LICENSE-APACHE .
          npm pack
          npx -y publint@0.3 --strict
      - name: 构建演示页
        working-directory: examples/web-demo
        run: |
          npm ci
          npm run build
      - name: 演示页冒烟测试（无头浏览器）
        working-directory: examples/web-demo
        run: |
          npx vite preview --port 4173 --strictPort &
          npm i --no-save --no-audit --no-fund playwright@1.64.0
          npx playwright install --with-deps chromium
          for i in $(seq 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          node smoke.mjs http://localhost:4173/
      - uses: actions/upload-artifact@v7
        with:
          name: geoverse-precise-npm
          path: packages/geoverse-precise/*.tgz
          retention-days: 14
