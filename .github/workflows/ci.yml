name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 必须与 crates/wasm/Cargo.toml 中锁定的 wasm-bindgen 版本一致
  WASM_BINDGEN_VERSION: 0.2.128
  # clippy 门禁使用的工具链（本地已验证 -D warnings 通过的版本）
  CLIPPY_TOOLCHAIN: 1.97.0

jobs:
  rust:
    name: Rust（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # clippy 门禁固定工具链版本：新版 clippy 增加的 lint 不会让 CI 突然变红，
      # 升级在下方 clippy-latest 任务中先以警告形式暴露，再手动调整 CLIPPY_TOOLCHAIN。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CLIPPY_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test（含 GeographicLib / PROJ 对照）
        run: cargo test -p geoverse-precise-core --release

  clippy-latest:
    name: clippy（最新 stable，仅提示，失败不阻塞）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy -D warnings（结果转为注释）
        run: |
          set +e
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings > clippy.txt 2>&1
          code=$?
          cat clippy.txt
          echo "::notice::$(rustc --version) / clippy exit code ${code}"
          grep -E '^[^ ]+\.rs:[0-9]+:[0-9]+: (warning|error)' clippy.txt \
            | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (warning|error)(\[[^]]*\])?: (.*)$/::warning file=\1,line=\2,col=\3::\4: \6/'
          # 非源码定位的错误（依赖、工具链等）也转成注释，最多 20 行
          grep -E '^(error|warning)' clippy.txt | grep -v -E '^warning: .* generated [0-9]+ warning' | head -20 \
            | sed -E 's/^(.*)$/::warning::\1/'
          exit "${code}"

  wasm:
    name: WASM + TypeScript 包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-bindgen-${{ env.WASM_BINDGEN_VERSION }}
      - name: 安装 wasm-bindgen-cli
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q " ${WASM_BINDGEN_VERSION}"; then
            cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked --force
          fi
          wasm-bindgen --version
      - name: 编译 wasm
        run: ./scripts/build-wasm.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/geoverse-precise/package-lock.json
      - name: 编译并测试 TS 封装
        working-directory: packages/geoverse-precise
        run: |
          npm ci
          npm run build
          npm test
      - name: 打包 npm tarball
        working-directory: packages/geoverse-precise
        run: |
          cp ../../LICENSE-MIT ../../LICENSE-APACHE .
          npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: geoverse-precise-npm
          path: packages/geoverse-precise/*.tgz
          retention-days: 14
