name: Release

# 推送 vX.Y.Z 标签：校验 → 编译 → 测试 → 打包 → 生成构建来源证明 → 创建 GitHub Release（附 npm 包与校验和）。
# 手动运行（Actions → Release → Run workflow）：只做到打包为止，产物作为 workflow artifact 下载，
# 用于打标签前的演练。不自动发布到 npm / crates.io。
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 演练的版本号（不带 v，如 0.4.0），须与 Cargo.toml / package.json / CHANGELOG 一致
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 校验、编译与打包
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: 确定版本号并校验清单与 CHANGELOG
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; else VER="${INPUT_VERSION#v}"; fi
          CARGO_VER=$(grep -m1 -E '^version *= *"' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          NPM_VER=$(node -p "require('./packages/geoverse-precise/package.json').version")
          echo "version=$VER cargo=$CARGO_VER npm=$NPM_VER"
          if [ "$VER" != "$CARGO_VER" ] || [ "$VER" != "$NPM_VER" ]; then
            echo "::error::版本 $VER 与 Cargo.toml ($CARGO_VER) / package.json ($NPM_VER) 不一致"
            exit 1
          fi
          if ! grep -qE "^## \[${VER//./\\.}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::缺少 \"## [$VER]\" 段落，请先把 [Unreleased] 整理为该版本"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          case "$VER" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - uses: ./.github/actions/build-wasm
      - name: Rust 测试
        run: cargo test -p geoverse-precise-core --release

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/geoverse-precise/package-lock.json
      - name: 编译、测试并打包 TS 封装
        working-directory: packages/geoverse-precise
        run: |
          npm ci
          npm run build
          npm test
          cp ../../LICENSE-MIT ../../LICENSE-APACHE .
          npm pack
          npx -y publint@0.3 --strict

      - name: 整理发布产物与校验和
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p release
          cp "packages/geoverse-precise/geoverse-precise-${VER}.tgz" release/
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: 生成发布说明（取自 CHANGELOG）
        env:
          VER: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          {
            awk -v v="$VER" '
              $0 ~ "^## \\[" v "\\]" {on=1; next}
              on && /^## \[/ {exit}
              on {print}
            ' CHANGELOG.md
            echo
            echo "## 安装"
            echo
            echo '```bash'
            echo "npm install https://github.com/${REPO}/releases/download/v${VER}/geoverse-precise-${VER}.tgz"
            echo '```'
            echo
            echo "附件的 SHA256 见 \`SHA256SUMS.txt\`；构建来源证明可用 \`gh attestation verify geoverse-precise-${VER}.tgz -R ${REPO}\` 校验。"
          } > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.ver.outputs.version }}
          path: |
            release/
            release-notes.md
          retention-days: 30

  publish:
    name: 创建 GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.version }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*.tgz
      - uses: softprops/action-gh-release@v3
        with:
          name: geoverse-precise v${{ needs.build.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          files: |
            release/*.tgz
            release/SHA256SUMS.txt
