[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/GeoVerseLabs/geoverse-precise"
homepage = "https://github.com/GeoVerseLabs/geoverse-precise"
authors = ["GeoVerseLabs"]

[workspace.dependencies]
geo = { version = "0.33", default-features = false }
geo-types = "0.7"
geographiclib-rs = "0.2.7"
geojson = "1"
serde = { version = "1", features = ["derive"] }
spade = { version = "2.15", default-features = false }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
